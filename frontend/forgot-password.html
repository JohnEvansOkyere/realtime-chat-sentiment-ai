<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Realtime Chat AI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="auth-container">
        <h1>🔒 Forgot Password</h1>
        <p class="tagline">Enter your email to reset your password</p>
        
        <div class="info-box">
            <p>💡 You'll receive a password reset link that expires in 1 hour.</p>
        </div>
        
        <div id="authError" class="error-message" style="display: none;"></div>
        <div id="authSuccess" class="success-message" style="display: none;"></div>
        
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="resetEmail" placeholder="Enter your email" autocomplete="email">
        </div>
        
        <button class="auth-btn" onclick="sendResetLink()">Send Reset Link</button>
        
        <div class="auth-switch">
            <a href="index.html">← Back to Login</a>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api/v1';

        async function sendResetLink() {
            const email = document.getElementById('resetEmail').value;
            const errorDiv = document.getElementById('authError');
            const successDiv = document.getElementById('authSuccess');
            const btn = event.target;

            if (!email) {
                errorDiv.textContent = 'Please enter your email';
                errorDiv.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Sending...';
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            try {
                const response = await fetch(`${API_URL}/auth/forgot-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (response.ok) {
                    successDiv.innerHTML = `
                        ✅ ${data.message}<br><br>
                        <strong>Check your email inbox!</strong><br>
                        <small>Don't forget to check your spam folder.</small>
                    `;
                    successDiv.style.display = 'block';
                    document.getElementById('resetEmail').value = '';
                } else {
                    errorDiv.textContent = data.detail || 'Failed to send reset link';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = 'Network error. Please check if backend is running.';
                errorDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Send Reset Link';
            }
        }

        // Allow Enter key to submit
        document.getElementById('resetEmail').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                sendResetLink();
            }
        });
    </script>
</body>
</html>
