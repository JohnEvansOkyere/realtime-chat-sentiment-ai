<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Realtime Chat AI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="auth-container">
        <h1>🔐 Reset Password</h1>
        <p class="tagline">Create a new secure password</p>
        
        <div id="authError" class="error-message" style="display: none;"></div>
        <div id="authSuccess" class="success-message" style="display: none;"></div>
        
        <div id="invalidToken" class="invalid-token" style="display: none;">
            <h2>⚠️ Invalid or Expired Link</h2>
            <p>This password reset link is invalid or has expired.<br>Reset links expire after 1 hour for security.</p>
            <a href="forgot-password.html">Request a new reset link →</a>
        </div>
        
        <div id="resetForm">
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPassword" placeholder="Enter new password" minlength="8">
            </div>
            
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm new password" minlength="8">
            </div>
            
            <div class="password-requirements">
                <p>Password must contain:</p>
                <div id="req-length" class="requirement">At least 8 characters</div>
                <div id="req-match" class="requirement">Passwords match</div>
            </div>
            
            <button class="auth-btn" onclick="resetPassword()">Reset Password</button>
        </div>
    </div>
    <script src="config.js"></script>
    <script>
        const API_URL = config.API_URL;

        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        // Check if token exists
        if (!token) {
            document.getElementById('resetForm').style.display = 'none';
            document.getElementById('invalidToken').style.display = 'block';
        }

        // Password validation
        const newPassword = document.getElementById('newPassword');
        const confirmPassword = document.getElementById('confirmPassword');

        function validatePassword() {
            const password = newPassword.value;
            const confirm = confirmPassword.value;

            // Check length
            if (password.length >= 8) {
                document.getElementById('req-length').classList.add('valid');
            } else {
                document.getElementById('req-length').classList.remove('valid');
            }

            // Check match
            if (password && confirm && password === confirm) {
                document.getElementById('req-match').classList.add('valid');
            } else {
                document.getElementById('req-match').classList.remove('valid');
            }
        }

        newPassword.addEventListener('input', validatePassword);
        confirmPassword.addEventListener('input', validatePassword);

        // Reset password function
        async function resetPassword() {
            const password = newPassword.value;
            const confirm = confirmPassword.value;
            const errorDiv = document.getElementById('authError');
            const successDiv = document.getElementById('authSuccess');
            const btn = event.target;

            // Validate
            if (password.length < 8) {
                errorDiv.textContent = 'Password must be at least 8 characters';
                errorDiv.style.display = 'block';
                return;
            }

            if (password !== confirm) {
                errorDiv.textContent = 'Passwords do not match';
                errorDiv.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Resetting...';
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            try {
                const response = await fetch(`${API_URL}/auth/reset-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        token: token,
                        new_password: password 
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    successDiv.innerHTML = `✅ ${data.message}<br><br>Redirecting to login...`;
                    successDiv.style.display = 'block';
                    document.getElementById('resetForm').style.display = 'none';

                    // Redirect after 3 seconds
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 3000);
                } else {
                    if (data.detail.includes('Invalid') || data.detail.includes('expired')) {
                        document.getElementById('resetForm').style.display = 'none';
                        document.getElementById('invalidToken').style.display = 'block';
                    } else {
                        errorDiv.textContent = data.detail || 'Failed to reset password';
                        errorDiv.style.display = 'block';
                    }
                }
            } catch (error) {
                errorDiv.textContent = 'Network error. Please try again.';
                errorDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Reset Password';
            }
        }
    </script>
</body>
</html>
